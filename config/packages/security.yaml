security:
  # Registering the user and hashing passwords
  password_hashers:
    App\Entity\User:
      algorithm: auto

  # Providers configuration for loading users
  providers:
    database:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false
    public:
      pattern: ^/register
      security: false
    main:
      lazy: true
      provider: database
      form_login:
        login_path: app_login
        check_path: app_login
        enable_csrf: true
        username_parameter: _email
        password_parameter: _password
        default_target_path: app_home
        failure_path: app_login
        always_use_default_target_path: true
        use_referer: true
      logout:
        path: app_logout
        target: app_home
      remember_me:
        secret: '%kernel.secret%'
        lifetime: 604800  # 1 week in seconds
        always_remember_me: true

  access_control:
    # Admin routes
    - { path: ^/admin, roles: ROLE_ADMIN }

    # User profile routes
    - { path: ^/profile, roles: ROLE_USER }

    # Recipe management routes
    - { path: ^/recipe/new, roles: ROLE_USER }
    - { path: ^/recipe/\d+/edit, roles: ROLE_USER }
    - { path: ^/recipe/\d+/delete, roles: ROLE_USER }

    # Comment management routes
    - { path: ^/comment/new, roles: ROLE_USER }
    - { path: ^/comment/\d+/edit, roles: ROLE_USER }
    - { path: ^/comment/\d+/delete, roles: ROLE_USER }

    # Role hierarchy (e.g., an admin has access to user routes)
  role_hierarchy:
    ROLE_ADMIN: ROLE_USER

# Test-specific password hasher settings (for lower security during tests)
when@test:
  security:
    password_hashers:
      Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
        algorithm: auto
        cost: 4  # Lowest possible value for bcrypt
        time_cost: 3  # Lowest possible value for argon
        memory_cost: 10  # Lowest possible value for argon
